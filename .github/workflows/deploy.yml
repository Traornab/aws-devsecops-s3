name: DevSecOps Pipeline
on: [push]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le code
        uses: actions/checkout@v4

      # Note : OIDC (iam:CreateOpenIDConnectProvider) étant bloqué par une SCP de l'organisation AWS,
      # l'authentification repose sur un utilisateur IAM dédié aux permissions restreintes via GitHub Secrets.
      - name: Authentification AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Audit de sécurité (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          config_file: .checkov.yaml
          soft_fail: false

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.11.0"

      - name: Terraform Init & Plan
        run: |
          terraform init
          terraform plan -out=tfplan

      - name: Déploiement Terraform
        run: terraform apply -auto-approve tfplan
